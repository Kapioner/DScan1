# Przykładowa konfiguracja DScan.
# Skopiuj do `dscan.toml` (plik lokalny, ignorowany przez git) i uzupełnij.
#
# Kolejność ważności: wartości domyślne < ten plik < zmienne DSCAN_<SEKCJA>__<POLE>
# np. DSCAN_LIMITS__NMAP_MAX_RATE=50
#
# Sekrety NIE należą do tego pliku - tylko zmienne środowiskowe:
#   DSCAN_ENCRYPTION_KEY  klucz szyfrowania
#                         (64 znaki hex; wygeneruj: openssl rand -hex 32)
#   DSCAN_DATABASE_URL    adres bazy, np. postgres://dscan:haslo@127.0.0.1:5433/dscan
#   DSCAN_ADMIN_USERNAME, DSCAN_ADMIN_PASSWORD
#                         konto administratora tworzone przy pierwszym starcie serwera
#   DSCAN_DEFECTDOJO_TOKEN
#                         token API DefectDojo (sekcja [defectdojo])

# --- Środowisko testowe od organizatora (D3) --------------------------------
# UWAGA: poniższe wartości są przykładowe. Zastąp je danymi z regulaminu
# laboratorium: adresacją kontenerów, listą dozwolonych portów i limitem ruchu.
[scope]
# Sieci, które wolno skanować. Cele spoza listy będą odrzucane.
allowed_networks = ["172.20.0.0/24"]
# Dozwolone porty: pojedyncze ("443") lub zakresy ("8000-8100").
allowed_ports = ["21-23", "25", "53", "80", "110", "143", "443", "445", "3306", "5432", "8000-8100", "8443"]
# Łączny limit ruchu generowanego przez skaner (kbit/s).
max_bandwidth_kbps = 512

# --- Limity tempa -----------------------------------------------------------
[limits]
# Łączny limit pakietów/s dla wszystkich procesów nmap razem (dzielony między nie;
# dodatkowo ograniczany przez scope.max_bandwidth_kbps).
nmap_max_rate = 100
# Liczba równoległych procesów nmap.
max_parallel_nmap = 4
# Globalny limit zapytań HTTP na sekundę.
http_requests_per_second = 10
# Maksymalna liczba zapytań HTTP do jednego hosta w przebiegu (wszystkie jego usługi WWW razem:
# strona główna, favicon i sondy - przy kilku usługach na hoście potrzeba ok. 25 na usługę).
http_requests_per_host = 150
# Adresów w jednej podgrupie (= jeden proces nmap); potęga dwójki, np. 256 = jedna sieć /24.
subgroup_size = 256
# Bezpiecznik: skan większej liczby adresów zostanie odrzucony.
max_addresses_per_scan = 1048576
# Dobór rozmiaru podgrup do zmierzonej przepustowości (EWMA), najwyżej subgroup_size.
adaptive_subgroups = true
# Docelowy czas skanu jednej podgrupy (s); w oknie czasowym najwyżej 1/4 pozostałego okna.
target_subgroup_seconds = 300

# --- Okna czasowe -----------------------------------------------------------
# Skanowanie tylko w podanych oknach (HH:MM). Okno może przechodzić przez północ.
# Brak okien = skanowanie dozwolone przez całą dobę.
[[schedule.windows]]
start = "22:00"
end = "06:00"

# --- Progi niestabilności ---------------------------------------------------
[stability]
# K: host nieaktywny po tylu kolejnych przebiegach bez odpowiedzi.
inactive_after_missed_runs = 3
# N: ile razy ponowić skan hosta, który nie odpowiedział.
unstable_retries = 2
# Odstęp między ponownymi próbami (sekundy).
retry_delay_seconds = 30

# --- Serwer HTTP (API) -------------------------------------------------------
[server]
# Adres nasłuchiwania. 127.0.0.1 = tylko lokalnie; 0.0.0.0 = z sieci.
listen = "127.0.0.1:8080"
# Maksymalny rozmiar żądania w bajtach (np. wgrywany plik CSV).
max_body_bytes = 2097152
# Ważność sesji po zalogowaniu (godziny).
session_hours = 12
# Flaga Secure ciasteczka sesji - ustaw true, gdy DScan działa za HTTPS (np. reverse proxy).
secure_cookies = false

# --- Baza danych PostgreSQL ---------------------------------------------------
# Adres bazy (z hasłem) podaje się WYŁĄCZNIE w zmiennej DSCAN_DATABASE_URL
# (./run.sh ustawia ją automatycznie w pliku .env).
[database]
max_connections = 10
connect_timeout_seconds = 5

# --- Klient HTTP (fingerprinting usług WWW) ---------------------------------
# Po skanie usług DScan odpytuje serwery WWW (tylko GET, bez logowania):
# tytuł strony, kod odpowiedzi, nagłówki, ciasteczka, łańcuch przekierowań.
[http]
enabled = true
timeout_seconds = 10
# Przekierowania są śledzone tylko w obrębie tego samego hosta.
max_redirects = 5
# Ile bajtów treści odpowiedzi czytać (wystarczy na tytuł strony).
max_body_bytes = 262144
user_agent = "DScan/0.1.0 (skaner bezpieczeństwa)"
# Bezpieczne sondowanie (tylko GET, bez formularzy i haseł): ścieżki sprawdzane na każdej
# usłudze WWW. Dochodzą do nich ścieżki z sygnatur (np. /wp-login.php).
probe_paths = ["/login", "/admin", "/version", "/robots.txt"]
# Najwyżej tyle sond na usługę (obowiązuje też limits.http_requests_per_host).
max_probes_per_service = 20
# Detekcje o pewności poniżej progu (0-100) są pomijane.
min_confidence = 30
# Dodatkowe sygnatury (np. przykłady od organizatora) w tym samym formacie YAML co wbudowane:
# signatures_file = "sygnatury-organizatora.yaml"

# --- DefectDojo ---------------------------------------------------------------
# Import surowego XML nmap (parser „Nmap Scan”) i eksport wybranych obserwacji.
# Token: zmienna DSCAN_DEFECTDOJO_TOKEN.
[defectdojo]
enabled = false
url = "http://127.0.0.1:8081"
product_name = "DScan"
product_type = "Research and Development"
engagement_name = "Skany DScan"
# Wysyłaj automatycznie po każdym udanym przebiegu.
auto_import = false
# Weryfikacja certyfikatu TLS DefectDojo (false tylko w lokalnym laboratorium).
verify_tls = true

# --- Ocena „ciekawości” znalezisk ---------------------------------------------
# Wynik usługi = suma wag spełnionych cech; uzasadnienie widać na dashboardzie.
[scoring]
admin_panel = 30
staging = 25
debug_mode = 30
old_version = 20
unusual_port = 10
expired_certificate = 15
self_signed_certificate = 10
tls_unverified = 5
new_service = 20
modified_service = 10
# Kategorie sygnatur: kamery, drukarki, CI/CD, bazy danych, panele.
sensitive_category = 25
# Kreator pierwszego uruchomienia (np. „WordPress › Installation”) - możliwe przejęcie aplikacji.
unfinished_setup = 40
# Protokół bez szyfrowania (FTP, Telnet).
cleartext_protocol = 10
# Baza danych lub broker wystawione bezpośrednio (Redis, MySQL, PostgreSQL, AMQP, MongoDB).
exposed_datastore = 15

# Wersja starsza niż podana = „stara wersja”. Klucz: fragment nazwy produktu (małe litery).
[scoring.minimum_versions]
openssh = "8.0"
apache = "2.4.50"
nginx = "1.20"
"microsoft iis" = "10.0"
php = "8.0"
tomcat = "9.0"
wordpress = "6.0"
jenkins = "2.400"
openssl = "3.0"
mysql = "8.0"

# --- Nazwane profile skanów --------------------------------------------------
# Wybór: ./run.sh scan CEL --profile NAZWA (oraz w interfejsie WWW przy uruchamianiu skanu).
# Profil podaje tylko to, co zmienia; reszta pochodzi z sekcji powyżej.
# Pola: mode (discovery|services), ports, max_rate, parallel, subgroup_size,
#       host_timeout_seconds, max_retries, windows, probe_paths.

[profiles.szybki]
# Tylko wykrywanie aktywnych hostów, szybciej.
mode = "discovery"
max_rate = 200

[profiles.pelny]
# Usługi na wszystkich dozwolonych portach, ostrożnie: 2 procesy, ponowienia.
mode = "services"
parallel = 2
max_retries = 2
host_timeout_seconds = 300

[profiles.nocny]
# Pełny skan tylko w nocy (harmonogram uruchamia go w oknie).
mode = "services"
windows = [{ start = "22:00", end = "06:00" }]
