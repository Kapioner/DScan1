[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Kapioner/DScan"

[workspace.dependencies]
# Crate'y wewnętrzne
dscan-core = { path = "crates/core" }
dscan-config = { path = "crates/config" }

# Zależności zewnętrzne (wersje w jednym miejscu dla całego workspace)
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
ipnet = { version = "2", features = ["serde"] }
figment = { version = "0.10", features = ["toml", "env"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Zasada projektu: brak unwrap()/expect() w kodzie produkcyjnym (w testach dozwolone, patrz clippy.toml)
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
