[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Kapioner/DScan"

[workspace.dependencies]
# Crate'y wewnętrzne
dscan-core = { path = "crates/core" }
dscan-config = { path = "crates/config" }
dscan-db = { path = "crates/db" }
dscan-api = { path = "crates/api" }

# Zależności zewnętrzne (wersje w jednym miejscu dla całego workspace)
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
ipnet = { version = "2", features = ["serde"] }
figment = { version = "0.10", features = ["toml", "env"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "5"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "chrono"] }
http-body-util = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Zasada projektu: brak unwrap()/expect() w kodzie produkcyjnym (w testach dozwolone, patrz clippy.toml)
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
