{% extends "base.html" %}
{% block title %}Pulpit{% endblock %}
{% block content %}
<h1>Pulpit</h1>
<section class="card">
  <h2>Przebiegi skanów</h2>
  <p class="muted">Lista odświeża się co 5 sekund. Skan uruchomisz poleceniem <code>./run.sh scan CEL…</code>.</p>
  <div hx-get="/ui/partials/scans" hx-trigger="load, every 5s" hx-swap="innerHTML">
    <p class="muted">Wczytywanie…</p>
  </div>
</section>
{% endblock %}
