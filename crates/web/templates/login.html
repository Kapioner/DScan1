<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logowanie · DScan</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="centered">
  <form class="card login" method="post" action="/login">
    <h1>DScan</h1>
    <p class="muted">Defect Scan — zaloguj się</p>
    {% if let Some(message) = error %}<p class="error" role="alert">{{ message }}</p>{% endif %}
    <label>Login <input name="username" value="{{ username }}" autocomplete="username" required autofocus></label>
    <label>Hasło <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Zaloguj</button>
  </form>
</body>
</html>
