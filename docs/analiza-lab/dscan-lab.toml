# Konfiguracja DScan do analizy skuteczności na laboratorium organizatorów.
[scope]
allowed_networks = ["127.0.0.0/8"]
# Porty ze wszystkich czterech stacków laboratorium + typowe porty usług.
allowed_ports = ["21", "22", "80", "81", "443", "2223", "3000-3001", "3306", "5432", "5672-5673", "6379", "8080-8090", "8474", "8666", "8787", "8888", "15432", "15672-15673", "21000-21010"]
max_bandwidth_kbps = 100000

[limits]
nmap_max_rate = 2000
max_parallel_nmap = 4
http_requests_per_second = 50
http_requests_per_host = 200
subgroup_size = 256

[stability]
inactive_after_missed_runs = 3
unstable_retries = 1
retry_delay_seconds = 5

[server]
listen = "127.0.0.1:9080"

[http]
enabled = true
timeout_seconds = 10
max_probes_per_service = 20
min_confidence = 30

[defectdojo]
enabled = true
url = "http://127.0.0.1:8180"
product_name = "DScan lab"
engagement_name = "DScan — testy"
auto_import = false
