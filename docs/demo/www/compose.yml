# Usługa demo do skanu z panelu WWW: cel 127.0.0.1, porty 8088 (HTTP) i 8089 (HTTPS).
# Uruchamia ją scripts/demo.sh (i install.sh); certyfikat self-signed tworzy ten sam skrypt.
name: dscan-demo-www
services:
  www:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
      - "127.0.0.1:8089:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
