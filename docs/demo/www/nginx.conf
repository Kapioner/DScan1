# HTTP: przekierowanie / → /admin/, panel logowania WordPress, nagłówki debugowania, ciasteczka.
server {
    listen 80;
    absolute_redirect off;
    root /usr/share/nginx/html;

    location = / {
        add_header X-Powered-By "PHP/5.6.40" always;
        return 302 /admin/;
    }
    location /admin/ {
        add_header X-Powered-By "PHP/5.6.40" always;
        add_header X-Debug-Token "8f3a2c" always;
        add_header Set-Cookie "PHPSESSID=demo0123456789; Path=/; HttpOnly" always;
        add_header Set-Cookie "wordpress_test_cookie=WP+Cookie+check; Path=/" always;
        index index.html;
    }
    location = /robots.txt { }
}

# HTTPS z certyfikatem self-signed dla staging.lab.local: intranet „Development”.
server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    root /usr/share/nginx/html/intranet;
    location / {
        add_header X-Environment "staging" always;
        index index.html;
    }
}
